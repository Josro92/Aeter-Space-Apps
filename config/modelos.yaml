# Configuración de modelos del médico virtual.
# Los nombres de modelos y el proveedor activo viven SOLO aquí, nunca en el código.

# Proveedor que se usa para responder. Valores posibles: gemini, claude
proveedor_activo: gemini

proveedores:
  gemini:
    # Modelo estable recomendado por la documentación oficial de Google (consultada 2026-11-13).
    modelo: gemini-3.5-flash-lite
    # Nombre de la variable de .env que guarda la llave (no la llave en sí).
    variable_llave: GEMINI_API_KEY
    max_tokens: 1400
    activo: true

  claude:
    modelo: claude-sonnet-5-5
    variable_llave: ANTHROPIC_API_KEY
    max_tokens: 1400
    # Inactivo hasta que exista la llave de Anthropic.
    activo: false

# Orden en que se intentarían los proveedores si uno falla.
# SOLO ESTRUCTURA: el cambio automático se implementa en una etapa posterior.
orden_respaldo:
  - gemini
  - claude
